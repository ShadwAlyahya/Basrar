<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basrar - AI Data Analytics Platform</title>
    <style>
        @font-face {
            font-family: 'TUFULI';
            src: local('TUFULI'), url('fonts/TUFULI.woff2') format('woff2');
        }

        @font-face {
            font-family: 'Milan Display';
            src: local('Milan Display'), url('fonts/MilanDisplay.woff2') format('woff2');
        }

        :root {
            --bg-color: #EFECE9;
            --text-main: #1A1A1A;
            --text-sub: #112244;
            --accent-green: #3B5848;
            --font-en: 'TUFULI', 'Segoe UI', sans-serif;
            --font-ar: 'Milan Display', 'Traditional Arabic', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-en);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 24px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(17, 34, 68, 0.1);
        }

        .brand-logo {
            font-family: var(--font-en);
            font-size: 32px;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

            .nav-links button {
                background: transparent;
                border: none;
                color: var(--text-sub);
                font-family: inherit;
                font-size: 16px;
                cursor: pointer;
            }

        .lang-btn {
            background-color: var(--accent-green) !important;
            color: var(--bg-color) !important;
            padding: 6px 14px;
            border-radius: 4px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(17, 34, 68, 0.15);
            border-radius: 12px;
            padding: 32px;
        }

        h2 {
            color: var(--text-main);
            margin-bottom: 16px;
        }

        label {
            color: var(--text-sub);
            font-size: 16px;
            display: block;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--text-sub);
            background: transparent;
            border-radius: 6px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        .btn-action {
            background-color: var(--accent-green);
            color: var(--bg-color);
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 18px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.2s;
        }

            .btn-action:hover {
                opacity: 0.9;
            }

        .smooth-arrow {
            width: 20px;
            height: 20px;
            fill: var(--bg-color);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">BASRAR</div>
        <div class="nav-links">
            <button onclick="switchSection('auth-section')" data-key="nav_auth">Authentication</button>
            <button onclick="switchSection('upload-section')" data-key="nav_upload">Upload Dataset</button>
            <button class="lang-btn" onclick="toggleLanguage()">عربي / EN</button>
        </div>
    </header>

    <div class="container">

        <section id="auth-section" class="card">
            <h2 data-key="auth_title">Login / Register</h2>
            <div class="form-group">
                <label data-key="lbl_email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label data-key="lbl_password">Password</label>
                <input type="password" id="password">
            </div>
            <button class="btn-action" onclick="handleLogin()">
                <span data-key="btn_login">Login</span>
                <svg class="smooth-arrow" viewBox="0 0 24 24">
                    <path d="M4 12h12.17l-4.58-4.59L13 6l7 7-7 7-1.41-1.41L16.17 13H4v-2z" />
                </svg>
            </button>
        </section>

        <section id="upload-section" class="card hidden">
            <h2 data-key="upload_title">Upload Dataset File</h2>
            <div class="form-group">
                <label data-key="lbl_file">Choose CSV or Excel file</label>
                <input type="file" id="datasetFile" accept=".csv, .xlsx, .xls">
            </div>
            <button class="btn-action" onclick="handleUpload()">
                <span data-key="btn_upload">Upload & Submit</span>
                <svg class="smooth-arrow" viewBox="0 0 24 24">
                    <path d="M4 12h12.17l-4.58-4.59L13 6l7 7-7 7-1.41-1.41L16.17 13H4v-2z" />
                </svg>
            </button>
        </section>

    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let authToken = "";
        let currentLang = "en";

        const translations = {
            en: {
                nav_auth: "Authentication",
                nav_upload: "Upload Dataset",
                auth_title: "Login / Register",
                lbl_email: "Email Address",
                lbl_password: "Password",
                btn_login: "Login",
                upload_title: "Upload Dataset File",
                lbl_file: "Choose CSV or Excel file",
                btn_upload: "Upload & Submit"
            },
            ar: {
                nav_auth: "المصادقة",
                nav_upload: "رفع البيانات",
                auth_title: "تسجيل الدخول / إنشاء حساب",
                lbl_email: "البريد الإلكتروني",
                lbl_password: "كلمة المرور",
                btn_login: "دخول",
                upload_title: "رفع ملف البيانات",
                lbl_file: "اختر ملف CSV أو Excel",
                btn_upload: "رفع وإرسال"
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === "en" ? "ar" : "en";
            const htmlRoot = document.getElementById("html-root");

            if (currentLang === "ar") {
                htmlRoot.setAttribute("lang", "ar");
                htmlRoot.setAttribute("dir", "rtl");
                document.body.style.fontFamily = "var(--font-ar)";
            } else {
                htmlRoot.setAttribute("lang", "en");
                htmlRoot.setAttribute("dir", "ltr");
                document.body.style.fontFamily = "var(--font-en)";
            }

            document.querySelectorAll("[data-key]").forEach(el => {
                const key = el.getAttribute("data-key");
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });
        }

        function switchSection(sectionId) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('upload-section').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    alert(currentLang === "ar" ? "تم تسجيل الدخول بنجاح!" : "Logged in successfully!");
                    switchSection('upload-section');
                } else {
                    alert(currentLang === "ar" ? "خطأ في بيانات الدخول" : "Invalid login credentials");
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function handleUpload() {
            const fileInput = document.getElementById('datasetFile');
            if (!fileInput.files[0] || !authToken) {
                alert(currentLang === "ar" ? "يرجى اختيار ملف والتأكد من تسجيل الدخول أولاً." : "Please select a file and ensure you are logged in.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch(`${API_BASE}/datasets/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    alert((currentLang === "ar" ? "تم رفع الملف بنجاح! ID: " : "File uploaded successfully! ID: ") + data.id);
                } else {
                    alert(currentLang === "ar" ? "فشل في رفع الملف." : "Failed to upload file.");
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
